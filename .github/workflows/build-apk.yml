name: Build SSS 2 Mathematics APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "sss-2-mathematics-app",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web app ready"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r ./*.html www/ 2>/dev/null || true
          cp -r ./*.css www/ 2>/dev/null || true
          cp -r ./*.js www/ 2>/dev/null || true
          cp -r ./images www/ 2>/dev/null || true
          cp -r ./assets www/ 2>/dev/null || true

      - name: Initialize Capacitor
        run: |
          npx cap init "SSS 2 Mathematics" "com.sss2mathematics.app" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-2-Mathematics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
